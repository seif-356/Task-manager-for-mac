name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          xcodebuild \
            -project TaskManager.xcodeproj \
            -target TaskManager \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify the app binary contains the app's code
        run: |
          BIN=build/Release/TaskManager.app/Contents/MacOS/TaskManager
          test -x "$BIN"
          file "$BIN"
          for symbol in ProcessStore SystemMonitor StartupStore; do
            nm "$BIN" | grep -q "$symbol" || { echo "missing $symbol"; exit 1; }
          done
          echo "OK: all three modules compiled into the binary"
