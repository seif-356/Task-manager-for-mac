name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          xcodebuild \
            -project TaskManager.xcodeproj \
            -target TaskManager \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            build
